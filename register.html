<!DOCTYPE html>
<html>
    <head>
        <title>REGISTER</title>
        <center>
        <h1>REGISTER PAGE</h1>
        <body>
            <form>
                <label>USER NAME:</label>
                <input type="text" name="username"><br><br>
                <label>PHONE NO:</label>
                <input type="number" name="phone number"><br><br>
                <label>EMAIL ID:</label>
                <input type="email" name="email id"><br><br>
                <label>PASSWORD:</label>
                <input type="password" name="password"><br><br>
                <label>CONFIRM PASSWORD:</label>
                <input type="password" name="password"><br><br>
                <button type="button" name="register" onclick ="window.location.href='login.html'">SUMBIT</button>
                <p>Already have an account? <a href="home.html">Login here</a></p>
           
            </form>
        </body>
        </center>
        <style>
            body {
                background-color: #6ab1f0;
                font-family: Arial, sans-serif;
            }
            h1 {
                color: #333;
            }
            label {
                font-weight: bold;
            }
            input[type="text"], input[type="number"], input[type="email"], input[type="password"] {
                width: 200px;
                padding: 5px;
                margin-bottom: 10px;
            }
            button {
                padding: 10px 15px;
                background-color: #9351df;
                color: white;
                border: none;
                cursor: pointer;
            }
            button:hover {
                background-color: #da1667;
            } 
            
            a {
                text-decoration: none;
                color: #9351df;
                font-weight: bold;
            }
        </style>
    </head>
</html>
